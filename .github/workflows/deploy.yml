name: Deploy to ECS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-app .

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v1
        with:
          node-version: 18
      - run: npm ci --legacy-peer-deps
      - run: npm run build


  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t devops-app .

      - name: Tag Docker Image
        run: |
          docker tag devops-app:latest 149057603822.dkr.ecr.us-east-1.amazonaws.com/devops-app-repo:latest

      - name: Push Docker Image
        run: |
          docker push 149057603822.dkr.ecr.us-east-1.amazonaws.com/devops-app-repo:latest

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster devops-cluster \
            --service devops-app-service \
            --force-new-deployment